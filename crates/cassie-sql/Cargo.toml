[package]
name = "cassie-sql"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
cassie-core = { path = "../cassie-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value", "arbitrary_precision"] }

[dev-dependencies]
cassie-bench-support = { path = "../cassie-bench-support" }

[[bench]]
name = "tier2_subsystem_parser"
harness = false
path = "benches/tier2_subsystem_parser.rs"

[lints]
workspace = true
