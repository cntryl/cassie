name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: "1.100.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install verified Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Install cntryl-tools
        run: cargo install --locked --git https://github.com/cntryl/tools --rev 4fd7f318c1f8c24bdb5d4bbea1b05d85b10f4bb5 cntryl-tools

      - name: Validate workspace test conventions
        run: cntryl-tools validate-tests

      - name: Lint all workspace targets and features
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings -D clippy::pedantic

  backend-crates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: "1.100.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install verified Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Cassie binaries
        run: cargo build --locked -p cassie --bins

      - name: Test workspace crates and doctests
        run: cargo test --locked --workspace --exclude cassie-e2e --all-features

  backend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: "1.100.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install verified Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Test end-to-end package
        run: cargo test --locked --all-features -p cassie-e2e

  backend:
    if: always()
    needs: [backend-checks, backend-crates, backend-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all backend jobs to pass
        env:
          CHECKS_RESULT: ${{ needs.backend-checks.result }}
          CRATES_RESULT: ${{ needs.backend-crates.result }}
          E2E_RESULT: ${{ needs.backend-e2e.result }}
        run: |
          if [[ "$CHECKS_RESULT" != "success" || "$CRATES_RESULT" != "success" || "$E2E_RESULT" != "success" ]]; then
            echo "Backend checks did not all succeed (checks=$CHECKS_RESULT, crates=$CRATES_RESULT, e2e=$E2E_RESULT)."
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up npm
        run: npm install --global npm@12.2.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          run-install: false

      - name: Install UI dependencies
        run: npm ci

      - name: Askr analyzer
        run: npx --no-install askr analyze

      - name: Check generated adapters
        run: npm run gen:adapters:check

      - name: UI format check
        run: npm run fmt:check

      - name: UI lint
        run: npm run lint

      - name: UI type check
        run: npm run type-check

      - name: UI build
        run: npm run build

      - name: Install Playwright browser
        run: npm run install:browsers

      - name: UI tests
        run: npm run test
