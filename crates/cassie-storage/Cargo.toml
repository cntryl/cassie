[package]
name = "cassie-storage"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
cassie-core = { path = "../cassie-core" }
cassie-sql = { path = "../cassie-sql" }
cntryl-midge = "0.5.3"
cntryl-lexkey = { package = "cntryl-lexkey", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
