# AI Agents should not touch this file

name: CI Backend

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "ui/**"
  push:
    paths-ignore:
      - "ui/**"
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-quality"

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Cargo fmt check
        run: cargo fmt --all -- --check

      - name: Install cntryl-tools
        run: |
          cargo install --git https://github.com/cntryl/tools \
            --rev bc2d07782cf6873e1a4962fe8fe91396daa81a24 \
            --locked cntryl-tools

      - name: Validate Tests
        run: cntryl-tools validate-tests

      - name: Cargo clippy pedantic
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -D clippy::pedantic

      - name: Cargo check
        run: cargo check --workspace --all-targets --all-features

      - name: Cargo build
        run: cargo build --workspace --all-targets --all-features


  tests:
    name: tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [cassie, cassie-integration-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-tests"

      - name: Compile package targets
        run: cargo test --locked --package "${{ matrix.package }}" --all-targets --all-features --no-run

      - name: Run package correctness tests
        run: cargo test --locked --package "${{ matrix.package }}" --all-features

  backend:
    needs: [quality, tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require every backend gate
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.tests.result }}
        run: |
          if [ "$QUALITY_RESULT" != success ] || [ "$TEST_RESULT" != success ]; then
            echo "Backend validation did not pass: quality=$QUALITY_RESULT tests=$TEST_RESULT"
            exit 1
          fi
