[package]
name = "cassie-core"
version = "0.2.0"
edition = "2021"
publish = false

[features]
numeric-test-hooks = []

[dependencies]
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
num-bigint = "0.5.1"
num-integer = "0.1.47"
num-traits = "0.2.19"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.54", features = ["sync"] }
uuid = { version = "1.29", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
jiff = { version = "1.0.1", default-features = false, features = ["std", "tzdb-bundle-always"] }
jiff-tzdb = "1.0.0"

[lints]
workspace = true
