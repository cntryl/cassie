[package]
name = "cassie-embeddings"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
cassie-core.workspace = true
reqwest = { workspace = true, features = ["blocking", "json"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value", "arbitrary_precision"] }
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true

[dev-dependencies]
cassie-bench-support.workspace = true

[[bench]]
name = "tier1_hotpath_local_embedding"
harness = false
path = "benches/tier1_hotpath_local_embedding.rs"

[[bench]]
name = "tier2_subsystem_local_embeddings"
harness = false
path = "benches/tier2_subsystem_local_embeddings.rs"

[lints]
workspace = true
