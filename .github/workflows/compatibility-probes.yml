name: Compatibility Probes

on:
  workflow_dispatch:
    inputs:
      probe:
        description: Client workflow to exercise
        required: true
        type: choice
        options:
          - native
          - sqlx
          - diesel
          - prisma
          - sqlalchemy
          - psql
          - pgadmin-9.16
          - dbeaver-26.1.3
          - catalog
      run_external:
        description: Run an external client; false records an unavailable result
        required: true
        default: false
        type: boolean
      source_revision:
        description: Cassie source revision recorded in the manifest
        required: true
        type: string

permissions:
  contents: read

env:
  SQLALCHEMY_VERSION: 2.0.36
  PSYCOPG_VERSION: 3.2.3
  PRISMA_VERSION: 6.1.0
  POSTGRES_CLIENT_IMAGE: postgres:16.6-bookworm
  DIESEL_VERSION: 2.2.6
  SQLX_VERSION: 0.8.3
  PGADMIN_VERSION: 9.16
  DBEAVER_VERSION: 26.1.3
  POSTGRES_JDBC_VERSION: 42.7.11

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision }}

      - name: Validate exact source revision
        shell: bash
        run: |
          set -euo pipefail
          resolved_revision="$(git rev-parse HEAD)"
          if [[ "${{ inputs.source_revision }}" != "${resolved_revision}" ]]; then
            echo "source revision must be the exact checked-out commit" >&2
            exit 1
          fi

      - name: Set up Rust
        if: inputs.probe == 'native' || inputs.probe == 'sqlx' || inputs.probe == 'diesel' || inputs.probe == 'prisma' || inputs.probe == 'psql' || inputs.probe == 'pgadmin-9.16' || inputs.probe == 'dbeaver-26.1.3'
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        if: inputs.probe == 'sqlalchemy'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        if: inputs.probe == 'prisma'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned external clients
        if: inputs.run_external == true && (inputs.probe == 'sqlalchemy' || inputs.probe == 'prisma')
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.probe }}" == "sqlalchemy" ]]; then
            python -m pip install --disable-pip-version-check \
              "SQLAlchemy==${SQLALCHEMY_VERSION}" "psycopg[binary]==${PSYCOPG_VERSION}"
          else
            npm install --no-save --ignore-scripts "prisma@${PRISMA_VERSION}"
          fi

      - name: Install pinned psql wrapper
        if: inputs.run_external == true && inputs.probe == 'psql'
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/psql-pinned" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm --network host "$POSTGRES_CLIENT_IMAGE" psql "$@"
          EOF
          chmod +x "$RUNNER_TEMP/psql-pinned"

      - name: Run selected probe
        shell: bash
        env:
          COMPATIBILITY_PROBE: ${{ inputs.probe }}
          CASSIE_RUN_SQLX_COMPAT: ${{ inputs.run_external && inputs.probe == 'sqlx' && '1' || '0' }}
          CASSIE_RUN_DIESEL_COMPAT: ${{ inputs.run_external && inputs.probe == 'diesel' && '1' || '0' }}
          CASSIE_RUN_SQLALCHEMY_COMPAT: ${{ inputs.run_external && inputs.probe == 'sqlalchemy' && '1' || '0' }}
          CASSIE_RUN_PRISMA_COMPAT: ${{ inputs.run_external && inputs.probe == 'prisma' && '1' || '0' }}
          CASSIE_PSQL_BIN: ${{ runner.temp }}/psql-pinned
          CASSIE_PRISMA_BIN: ${{ github.workspace }}/node_modules/.bin/prisma
        run: |
          set -euo pipefail
          mkdir -p compatibility-artifacts
          {
            echo "probe=${{ inputs.probe }}"
            echo "source_revision=${{ inputs.source_revision }}"
            echo "rust_toolchain=$(rustc --version 2>/dev/null || echo unavailable)"
            echo "run_external=${{ inputs.run_external }}"
            echo "status=unavailable"
          } > compatibility-artifacts/manifest.txt

          if [[ "${{ inputs.run_external }}" != "true" ]]; then
            echo "status=unavailable (run_external=false)"
            exit 0
          fi

          case "${{ inputs.probe }}" in
            native)
              cargo test --locked --test compatibility compatibility_matrix::
              sed -i 's/^status=unavailable$/status=passed/' compatibility-artifacts/manifest.txt
              ;;
            sqlx)
              {
                echo "client=sqlx"
                echo "client_version=${SQLX_VERSION}"
                echo "deployment_profile=loopback-memory"
                echo "protocol=pgwire-extended-query"
              } >> compatibility-artifacts/manifest.txt
              if cargo test --locked --test compatibility \
                compatibility_sqlx::should_validate_sqlx_read_model_probe_when_enabled -- \
                --ignored --nocapture; then
                sed -i 's/^status=unavailable$/status=passed/' compatibility-artifacts/manifest.txt
              else
                sed -i 's/^status=unavailable$/status=failed/' compatibility-artifacts/manifest.txt
                exit 1
              fi
              ;;
            diesel)
              {
                echo "client=diesel"
                echo "client_version=${DIESEL_VERSION}"
                echo "deployment_profile=loopback-memory"
                echo "protocol=pgwire-extended-query"
              } >> compatibility-artifacts/manifest.txt
              if cargo test --locked --test compatibility \
                compatibility_diesel::should_validate_diesel_read_model_probe_when_enabled -- \
                --ignored --nocapture; then
                sed -i 's/^status=unavailable$/status=passed/' compatibility-artifacts/manifest.txt
              else
                sed -i 's/^status=unavailable$/status=failed/' compatibility-artifacts/manifest.txt
                exit 1
              fi
              ;;
            prisma)
              cargo test --locked --test compatibility \
                compatibility_matrix::should_validate_prisma_introspection_probe_when_enabled -- \
                --ignored --nocapture
              sed -i 's/^status=unavailable$/status=passed/' compatibility-artifacts/manifest.txt
              ;;
            sqlalchemy)
              cargo test --locked --test compatibility \
                compatibility_sqlalchemy::should_validate_sqlalchemy_read_model_probe_when_enabled -- \
                --ignored --nocapture
              sed -i 's/^status=unavailable$/status=passed/' compatibility-artifacts/manifest.txt
              ;;
            psql)
              cargo test --locked --test compatibility \
                compatibility_matrix::should_validate_psql_read_model_probe_when_enabled -- \
                --ignored --nocapture
              sed -i 's/^status=unavailable$/status=passed/' compatibility-artifacts/manifest.txt
              ;;
            pgadmin-9.16|dbeaver-26.1.3)
              export CASSIE_DESKTOP_TRACE_CLIENT="${{ inputs.probe }}"
              fixture="tests/fixtures/desktop_traces/${CASSIE_DESKTOP_TRACE_CLIENT}.json"
              fixture_digest="$(sha256sum "${fixture}" | awk '{print $1}')"
              cargo test --locked --test compatibility \
                desktop_client_trace_replay::should_replay_selected_desktop_trace -- \
                --ignored --nocapture
              {
                echo "client=${CASSIE_DESKTOP_TRACE_CLIENT}"
                echo "client_version=$([[ "${CASSIE_DESKTOP_TRACE_CLIENT}" == pgadmin-* ]] && echo "${PGADMIN_VERSION}" || echo "${DBEAVER_VERSION}")"
                echo "driver_version=$([[ "${CASSIE_DESKTOP_TRACE_CLIENT}" == dbeaver-* ]] && echo "${POSTGRES_JDBC_VERSION}" || echo not-applicable)"
                echo "deployment_profile=loopback-memory"
                echo "protocol=pgwire-trace-replay"
                echo "fixture=${fixture}"
                echo "fixture_sha256=${fixture_digest}"
                echo "certification_status=unavailable"
                echo "certification_reason=no-live-desktop-evidence"
              } >> compatibility-artifacts/manifest.txt
              sed -i 's/^status=unavailable$/status=replay-passed/' compatibility-artifacts/manifest.txt
              ;;
            catalog)
              echo "selected lane requires a separately provisioned catalog fixture"
              ;;
          esac

      - name: Retain normalized probe manifest
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ inputs.probe }}-${{ inputs.source_revision }}
          path: compatibility-artifacts/manifest.txt
          if-no-files-found: error
          retention-days: 30
