[workspace]
members = [
    "crates/cassie-core",
    "crates/cassie-search",
    "crates/cassie-vector",
    "crates/cassie-embeddings",
    "crates/cassie-sql",
    "crates/cassie-storage",
    "crates/cassie-engine",
    "crates/cassie-server",
    "crates/cassie-e2e",
    "crates/cassie-bench-support",
]
default-members = [
    "crates/cassie-core",
    "crates/cassie-search",
    "crates/cassie-vector",
    "crates/cassie-embeddings",
    "crates/cassie-sql",
    "crates/cassie-storage",
    "crates/cassie-engine",
    "crates/cassie-server",
    "crates/cassie-e2e",
]
resolver = "2"

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
cassie-bench-support = { path = "crates/cassie-bench-support" }
cntryl-midge = "0.6.0"
cntryl-stress = "0.5.1"

[workspace.lints.clippy]
pedantic = "warn"

[profile.dev]
opt-level = 0
# Line tables keep backtraces readable while cutting link time and target size.
debug = "line-tables-only"

[profile.test]
opt-level = 1
debug = "line-tables-only"

# Optimize the database under test; keep fixture/assertion compilation inexpensive.
[profile.test.package.cassie-e2e]
opt-level = 0
