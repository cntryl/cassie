[package]
name = "cassie-e2e"
# Keep aligned with Cassie for the existing version-contract assertions.
version = "0.1.0"
edition.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[features]
replay-benchmark-observation = ["cassie/replay-benchmark-observation"]

[[bench]]
name = "tier4_pgwire_fixture_profile"
path = "benches/support/pgwire_fixture_profile.rs"
harness = false

[lib]
name = "cassie_test_support"
path = "tests/support/pgwire_helpers/lib.rs"

[dependencies]
cassie = { path = "../cassie-server" }
num-traits.workspace = true
num-bigint.workspace = true
num-integer.workspace = true
bytes.workspace = true
chrono.workspace = true
http-body-util.workspace = true
hyper-util.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-rustls.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value", "arbitrary_precision"] }
parking_lot.workspace = true
thiserror.workspace = true
uuid.workspace = true
cntryl-midge.workspace = true
cntryl_lexkey.workspace = true
hyper.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest = { workspace = true, features = ["blocking", "json"] }
argon2.workspace = true
getrandom.workspace = true
sha2.workspace = true
md-5.workspace = true
time.workspace = true
jiff.workspace = true
url.workspace = true
regex-automata.workspace = true
regex-syntax.workspace = true
fancy-regex.workspace = true
sql-json-path.workspace = true
rust-stemmers.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["process"] }

[dev-dependencies]
cassie-storage = { workspace = true, features = ["storage-test-hooks"] }
cntryl-midge = { workspace = true, features = ["failpoints"] }
fail = "0.5.1"
cassie-core.workspace = true
cassie-bench-support.workspace = true
cntryl-stress.workspace = true
jiff-tzdb.workspace = true
rcgen.workspace = true
tokio-postgres.workspace = true
# A second real PostgreSQL driver for the graph type round trips (plaintext local connection).
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio"] }

