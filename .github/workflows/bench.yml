name: Bench

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      run_id:
        description: "Unique retained benchmark run ID"
        required: true
        type: string
      deployment_profile:
        description: "Registered deployment profile matching the runner"
        required: true
        type: string
      soak_duration_seconds:
        description: "Tier 6 duration per scenario; use 3600 for canonical evidence"
        required: true
        default: "3600"
        type: string
      shard:
        description: "Canonical shard to run"
        required: true
        default: all
        type: choice
        options:
          - all
          - tier1
          - tier2
          - tier3
          - tier4
          - tier5-query
          - tier5-retrieval
          - tier5-lifecycle
          - tier5-transport
          - tier6-mixed
          - tier6-transport
      workload:
        description: "Exact registered scenario ID within the selected shard, or all"
        required: true
        default: all
        type: string

permissions:
  contents: read

jobs:
  bench:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CASSIE_STORAGE_MODE: memory

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Install cntryl-tools
        run: cargo install --locked --git https://github.com/cntryl/tools --rev 0cb0d0c8be5951753580a6f8a527f3e47d293466 cntryl-tools

      - name: Validate benchmark contract
        run: cntryl-tools validate-benchmarks

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "bench"

      - name: Benchmark tier 1
        run: cargo bench --bench 'tier1*' --locked --quiet

      - name: Benchmark tier 2
        run: cargo bench --bench 'tier2*' --locked --quiet

      - name: Benchmark tier 3
        run: cargo bench --bench 'tier3*' --locked --quiet

      - name: Benchmark tier 4
        run: cargo bench --bench 'tier4*' --locked --quiet

      - name: Upload stress benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-stress-artifacts
          path: target/stress
          if-no-files-found: ignore

  complete-contract:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate canonical evidence inputs
        env:
          RUN_ID: ${{ inputs.run_id }}
          DEPLOYMENT_PROFILE: ${{ inputs.deployment_profile }}
          SOAK_DURATION_SECONDS: ${{ inputs.soak_duration_seconds }}
          SHARD: ${{ inputs.shard }}
          WORKLOAD: ${{ inputs.workload }}
        run: |
          if [[ ! "${RUN_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "run_id must be a bounded artifact-safe identifier" >&2
            exit 1
          fi
          if [[ "${DEPLOYMENT_PROFILE}" != "native-linux-amd64-disk" ]]; then
            echo "deployment_profile must be native-linux-amd64-disk" >&2
            exit 1
          fi
          if [[ ! "${SOAK_DURATION_SECONDS}" =~ ^[1-9][0-9]*$ ]] || (( 10#${SOAK_DURATION_SECONDS} < 3600 )); then
            echo "soak_duration_seconds must be an integer of at least 3600" >&2
            exit 1
          fi
          case "${SHARD}" in
            all|tier1|tier2|tier3|tier4|tier5-query|tier5-retrieval|tier5-lifecycle|tier5-transport|tier6-mixed|tier6-transport) ;;
            *)
              echo "shard must name a registered canonical shard" >&2
              exit 1
              ;;
          esac
          if [[ "${WORKLOAD}" != "all" ]]; then
            if [[ "${SHARD}" == "all" ]]; then
              echo "a selected workload requires one owning shard" >&2
              exit 1
            fi
            if [[ ! "${WORKLOAD}" =~ ^[a-z0-9][a-z0-9._-]{0,127}$ ]]; then
              echo "workload must be all or a bounded registered scenario ID" >&2
              exit 1
            fi
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate deployment profile
        env:
          DEPLOYMENT_PROFILE: ${{ inputs.deployment_profile }}
        run: |
          case "${DEPLOYMENT_PROFILE}" in
            native-linux-amd64-disk) ;;
            *)
              echo "unsupported benchmark deployment profile '${DEPLOYMENT_PROFILE}'" >&2
              exit 1
              ;;
          esac

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Install cntryl-tools
        run: cargo install --locked --git https://github.com/cntryl/tools --rev 0cb0d0c8be5951753580a6f8a527f3e47d293466 cntryl-tools

      - name: Validate benchmark contract
        run: cntryl-tools validate-benchmarks

  complete-shard:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: complete-contract
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - tier: tier1
            command: "cargo bench --bench 'tier1_*' --locked"
          - tier: tier2
            command: "cargo bench --bench 'tier2_*' --locked"
          - tier: tier3
            command: "cargo bench --bench 'tier3_*' --locked"
          - tier: tier4
            command: "cargo bench --bench 'tier4_*' --locked"
          - tier: tier5-query
            command: "cargo bench --bench 'tier5_scaling_query' --locked"
          - tier: tier5-retrieval
            command: "cargo bench --bench 'tier5_scaling_retrieval' --locked"
          - tier: tier5-lifecycle
            command: "cargo bench --bench 'tier5_scaling_lifecycle' --locked"
          - tier: tier5-transport
            command: "cargo bench --bench 'tier5_scaling_transport' --locked"
          - tier: tier6-mixed
            command: "cargo bench --bench 'tier6_soak_mixed' --locked"
          - tier: tier6-transport
            command: "cargo bench --bench 'tier6_soak_transport' --locked"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        if: ${{ inputs.shard == 'all' || inputs.shard == matrix.tier }}
        uses: actions/checkout@v7

      - name: Update Rust toolchain
        if: ${{ inputs.shard == 'all' || inputs.shard == matrix.tier }}
        run: rustup update stable

      - name: Cache Rust dependencies
        if: ${{ inputs.shard == 'all' || inputs.shard == matrix.tier }}
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "benchmark-evidence-${{ matrix.tier }}"

      - name: Run selected owner shard
        if: ${{ inputs.shard == 'all' || inputs.shard == matrix.tier }}
        env:
          CASSIE_BENCH_RUN_ID: ${{ inputs.run_id }}
          CASSIE_BENCH_DEPLOYMENT_PROFILE_ID: ${{ inputs.deployment_profile }}
          CASSIE_BENCH_SOAK_DURATION_SECONDS: ${{ inputs.soak_duration_seconds }}
          STRESS_PROFILE: release
          STRESS_OUTPUT_DIR: target/stress
          STRESS_FILTER: ${{ inputs.workload }}
          STRESS_ALLOW_EMPTY_FILTERED_OWNER: ${{ inputs.workload != 'all' && '1' || '0' }}
        run: |
          if [[ "${STRESS_FILTER}" == "all" ]]; then
            unset STRESS_FILTER
          fi
          find target/stress -type f -name latest.json -delete 2>/dev/null || true
          ${{ matrix.command }}

      - name: Validate selected workload artifact
        if: ${{ inputs.workload != 'all' && inputs.shard == matrix.tier }}
        env:
          SELECTED_WORKLOAD: ${{ inputs.workload }}
        run: |
          matched_artifacts=0
          while IFS= read -r artifact; do
            matching_specs="$(jq --arg workload "${SELECTED_WORKLOAD}" \
              '[.benchmark_specs[]? | select(.metadata.scenario_id == $workload)] | length' \
              "${artifact}")"
            if (( matching_specs > 0 )); then
              if (( matching_specs != 1 )); then
                echo "selected workload artifact must contain exactly one matching scenario" >&2
                exit 1
              fi
              other_specs="$(jq --arg workload "${SELECTED_WORKLOAD}" \
                '[.benchmark_specs[]? | select(.metadata.scenario_id != $workload)] | length' \
                "${artifact}")"
              if (( other_specs > 0 )); then
                echo "selected workload artifact contains another scenario" >&2
                exit 1
              fi
              matched_artifacts=$((matched_artifacts + 1))
            fi
          done < <(find target/stress -type f -name latest.json -print)
          if (( matched_artifacts != 1 )); then
            echo "selected workload did not produce exactly one matching scenario" >&2
            exit 1
          fi

      - name: Upload canonical shard artifacts
        if: ${{ always() && (inputs.shard == 'all' || inputs.shard == matrix.tier) }}
        uses: actions/upload-artifact@v7
        with:
          name: cassie-benchmark-shard-${{ inputs.run_id }}-${{ matrix.tier }}-${{ inputs.workload }}
          path: target/stress/**/latest.json
          if-no-files-found: ignore
          retention-days: 90

  complete-manifest:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.shard == 'all' && inputs.workload == 'all' }}
    needs: complete-shard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "benchmark-evidence-manifest"

      - name: Download canonical shard artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cassie-benchmark-shard-${{ inputs.run_id }}-*
          path: target/stress
          merge-multiple: true

      - name: Validate complete retained manifest
        run: cargo test --locked --test bench_operations benchmark_evidence_contract::should_validate_complete_benchmark_artifact_manifest -- --ignored --nocapture

      - name: Upload canonical owner artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cassie-benchmark-${{ inputs.run_id }}
          path: target/stress/**/latest.json
          if-no-files-found: error
          retention-days: 90
