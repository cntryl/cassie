# AI Agents should not touch this file

name: CI Backend

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "ui/**"
  push:
    paths-ignore:
      - "ui/**"
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  basics:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cntryl-tools
        run: |
          cargo install --git https://github.com/cntryl/tools \
            --rev bc2d07782cf6873e1a4962fe8fe91396daa81a24 \
            --locked cntryl-tools

      - name: Cargo fmt check
        run: cargo fmt --all -- --check

      - name: Validate tests
        run: cntryl-tools validate-tests

      - name: Cargo clippy pedantic
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -D clippy::pedantic

      - name: Cargo check
        run: cargo check --workspace --all-targets --all-features

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: unit-and-binary
            args: --lib --bins
            doctests: false
          - lane: integration-1
            args: >-
              --test configuration_isolated
              --test domain_models
              --test executor
              --test expression_index_upsert
              --test pgwire_core
              --test pgwire_extended
              --test sql_relation_identifiers
            doctests: true
          - lane: integration-2
            args: >-
              --test bench_operations
              --test columnar_surface
              --test graph_types
              --test pgwire_grammar
              --test query_scan_controls
              --test rest
              --test sql_set_operations
              --test vector_embeddings
            doctests: false
          - lane: integration-3
            args: >-
              --test catalog_security
              --test composite_types
              --test enum_types
              --test parser_types
              --test pgwire_types
              --test planner_controls
            doctests: false
          - lane: integration-4
            args: >-
              --test analytics
              --test bench_diagnostics
              --test compatibility
              --test graph_table
              --test metrics
              --test relational_qualification
              --test sql_contextual_literals
              --test sql_derived_sources
              --test sql_mutations
              --test time_series_float_partitions
            doctests: false
          - lane: integration-5
            args: >-
              --test constraint_ingress
              --test domain_types
              --test graph_guide
              --test graph_weighted
              --test json_writes
              --test null_safe_predicates
              --test pgwire_catalogs
              --test search
              --test sql_exists_subqueries
              --test sql_queries
              --test storage_indexes
              --test temporal_predicate_literals
            doctests: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Cargo test (${{ matrix.lane }})
        run: cargo test --locked --workspace --all-features ${{ matrix.args }}

      - name: Cargo doctests
        if: matrix.doctests
        run: cargo test --locked --workspace --all-features --doc

  backend:
    needs: [basics, test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require successful backend jobs
        env:
          BASICS_RESULT: ${{ needs.basics.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [[ "$BASICS_RESULT" != "success" || "$TEST_RESULT" != "success" ]]; then
            echo "Backend checks did not all succeed (basics=$BASICS_RESULT, test=$TEST_RESULT)."
            exit 1
          fi
