[package]
name = "cassie-search"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
rust-stemmers.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value", "arbitrary_precision"] }

[dev-dependencies]
cassie-bench-support.workspace = true

[[bench]]
name = "tier1_hotpath_search_vector"
harness = false
path = "benches/tier1_hotpath_search_vector.rs"

[[bench]]
name = "tier1_hotpath_bm25"
harness = false
path = "benches/tier1_hotpath_bm25.rs"

[[bench]]
name = "tier2_subsystem_search"
harness = false
path = "benches/tier2_subsystem_search.rs"

[lints]
workspace = true
