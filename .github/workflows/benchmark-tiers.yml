name: Benchmark Tiers 1–4

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: Benchmark tier to run
        type: choice
        options: [all, tier1, tier2, tier3, tier4]
        default: all
      profile:
        description: Measurement profile
        type: choice
        options: [smoke, standard, full]
        default: standard

permissions:
  contents: read

concurrency:
  group: benchmark-tiers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    uses: ./.github/workflows/run-registered-benchmarks.yml
    with:
      tiers: ${{ inputs.tier == 'tier1' && '1' || inputs.tier == 'tier2' && '2' || inputs.tier == 'tier3' && '3' || inputs.tier == 'tier4' && '4' || '1,2,3,4' }}
      profile: ${{ inputs.profile || 'full' }}
      max_parallel: 4
