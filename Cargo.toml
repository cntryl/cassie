[package]
name = "cassie"
version = "0.1.0"
edition = "2021"
publish = false
license-file = "LICENSE"

[dependencies]
bytes = "1.12"
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1.53", features = ["full"] }
tokio-rustls = "0.26"
rustls = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
thiserror = "2.0"
uuid = { version = "1.26", features = ["v4", "serde"] }
cntryl-midge = "0.1.1"
cntryl_lexkey = { package = "cntryl-lexkey", version = "0.1.0" }
hyper = { version = "1.11", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking", "json"] }
argon2 = "0.6"
getrandom = "0.4"
sha2 = "0.11"
time = { version = "0.3", features = ["formatting", "parsing"] }
url = "2.5"

[dev-dependencies]
cntryl-stress = "0.4.0"
rcgen = "0.14"
tokio-postgres = "0.7"

[[bench]]
name = "tier1_hotpath_row_codec"
harness = false
path = "benches/tier1_hotpath_row_codec.rs"

