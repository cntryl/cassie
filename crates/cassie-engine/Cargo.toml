[package]
name = "cassie-engine"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
replay-benchmark-observation = ["cassie-storage/replay-benchmark-observation"]
transport-test-hooks = ["cassie-storage/storage-test-hooks"]

[dependencies]
cassie-core.workspace = true
cassie-search.workspace = true
cassie-vector.workspace = true
cassie-embeddings = { path = "../cassie-embeddings" }
cassie-sql.workspace = true
cassie-storage.workspace = true
num-traits.workspace = true
num-bigint.workspace = true
num-integer.workspace = true
bytes.workspace = true
chrono.workspace = true
tokio = { workspace = true, features = ["full"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value", "arbitrary_precision"] }
parking_lot = { workspace = true, features = ["arc_lock"] }
thiserror.workspace = true
uuid.workspace = true
cntryl_lexkey.workspace = true
tracing.workspace = true
reqwest = { workspace = true, features = ["blocking", "json"] }
argon2.workspace = true
getrandom.workspace = true
sha2.workspace = true
md-5.workspace = true
time.workspace = true
jiff.workspace = true
jiff-tzdb.workspace = true
url.workspace = true
regex-automata.workspace = true
regex-syntax.workspace = true
fancy-regex.workspace = true
sql-json-path.workspace = true

[dev-dependencies]
cassie-bench-support.workspace = true
cassie-core = { workspace = true, features = ["numeric-test-hooks"] }
cassie-storage = { workspace = true, features = ["storage-test-hooks"] }
cntryl-midge.workspace = true
tracing-subscriber.workspace = true

[[bench]]
name = "tier1_hotpath_filter_projection"
harness = false
path = "benches/tier1_hotpath_filter_projection.rs"

