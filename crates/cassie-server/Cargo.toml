[package]
name = "cassie"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
autotests = false
license-file = "../../LICENSE"

[lints]
workspace = true

[features]
replay-benchmark-observation = ["cassie-engine/replay-benchmark-observation"]

[dependencies]
cassie-engine.workspace = true
base64 = "0.22"
bytes.workspace = true
http-body-util.workspace = true
hyper-util.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-rustls.workspace = true
rustls.workspace = true
ring = "0.17"
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value", "arbitrary_precision"] }
thiserror.workspace = true
uuid.workspace = true
hyper.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sha2.workspace = true
reqwest.workspace = true
url.workspace = true
sql-json-path.workspace = true
time.workspace = true

[dev-dependencies]
aws-lc-rs = { version = "1.19", features = ["ring-io"] }
tokio-postgres.workspace = true
cassie-engine = { workspace = true, features = ["transport-test-hooks"] }
cassie-bench-support.workspace = true
num-bigint.workspace = true
reqwest = { workspace = true, features = ["blocking", "json"] }
cntryl-stress.workspace = true
rcgen.workspace = true

[[bench]]
name = "tier1_hotpath_pgwire"
harness = false
path = "benches/tier1_hotpath_pgwire.rs"

[[bench]]
name = "tier2_subsystem_protocol_handlers"
harness = false
path = "benches/tier2_subsystem_protocol_handlers.rs"
