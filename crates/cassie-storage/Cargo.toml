[package]
name = "cassie-storage"
version = "0.1.0"
edition = "2021"
publish = false

[features]
replay-benchmark-observation = []
storage-test-hooks = []

[dependencies]
cassie-core = { path = "../cassie-core" }
cassie-search = { path = "../cassie-search" }
cassie-sql = { path = "../cassie-sql" }
cassie-vector = { path = "../cassie-vector" }
bytes = "1.12"
cntryl-midge = "0.6.0"
cntryl-lexkey = { package = "cntryl-lexkey", version = "0.1.0" }
lz4_flex = "0.14"
parking_lot = { version = "0.13", features = ["arc_lock"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "raw_value"] }
sha2 = "0.11"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1.54", features = ["sync"] }
tracing = "0.1"
url = "2.5"
uuid = { version = "1.29", features = ["v4", "v7", "serde"] }

[lints]
workspace = true

[dev-dependencies]
cassie-bench-support = { path = "../cassie-bench-support" }

[[bench]]
name = "tier1_hotpath_row_codec"
harness = false
path = "benches/tier1_hotpath_row_codec.rs"

[[bench]]
name = "tier1_hotpath_keys"
harness = false
path = "benches/tier1_hotpath_keys.rs"

[[bench]]
name = "tier2_subsystem_storage"
harness = false
path = "benches/tier2_subsystem_storage.rs"
