[package]
name = "cassie-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
cassie = { path = ".." }

[[bin]]
name = "column_manifest_decode"
path = "fuzz_targets/column_manifest_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "column_chunk_decode"
path = "fuzz_targets/column_chunk_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "column_codec_roundtrip"
path = "fuzz_targets/column_codec_roundtrip.rs"
test = false
doc = false
bench = false
