[package]
name = "cassie"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
autotests = false
license-file = "../../LICENSE"

[lints]
workspace = true

[features]
replay-benchmark-observation = ["cassie-engine/replay-benchmark-observation"]

[dependencies]
cassie-engine = { path = "../cassie-engine" }
base64 = "0.22"
bytes = "1.12"
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1.54", features = ["full"] }
tokio-rustls = "0.26"
rustls = "0.23"
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value", "arbitrary_precision"] }
thiserror = "2.0"
uuid = { version = "1.29", features = ["v4", "v7", "serde"] }
hyper = { version = "1.12", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
sha2 = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
sql-json-path = "0.2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }

[dev-dependencies]
aws-lc-rs = { version = "1.19", features = ["ring-io"] }
tokio-postgres = "0.7"
cassie-engine = { path = "../cassie-engine", features = ["transport-test-hooks"] }
cassie-bench-support.workspace = true
num-bigint = "0.5.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking", "json"] }
cntryl-stress.workspace = true
rcgen = "0.14"

[[bench]]
name = "tier1_hotpath_pgwire"
harness = false
path = "benches/tier1_hotpath_pgwire.rs"

[[bench]]
name = "tier2_subsystem_protocol_handlers"
harness = false
path = "benches/tier2_subsystem_protocol_handlers.rs"
