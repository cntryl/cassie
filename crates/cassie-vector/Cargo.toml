[package]
name = "cassie-vector"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
cassie-core = { path = "../cassie-core" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
cassie-bench-support.workspace = true

[[bench]]
name = "tier1_hotpath_vector_distance"
