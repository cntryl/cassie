[package]
name = "cassie-embeddings"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
cassie-core = { path = "../cassie-core" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value", "arbitrary_precision"] }
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.54", features = ["full"] }
tracing = "0.1"

[lints]
workspace = true
