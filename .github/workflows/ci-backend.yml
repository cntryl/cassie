# AI Agents should not touch this file

name: CI Backend

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "ui/**"
  push:
    paths-ignore:
      - "ui/**"
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Cargo fmt check
        run: cargo fmt --all -- --check

      - name: Install cntryl-tools
        run: cargo install --git https://github.com/cntryl/tools

      - name: Validate Tests
        run: cntryl-tools validate-tests

      - name: Cargo clippy pedantic
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -D clippy::pedantic

      - name: Cargo check
        run: cargo check --workspace --all-targets --all-features

      - name: Cargo build
        run: cargo build --workspace --all-targets --all-features

      - name: Cargo test
        run: cargo test --workspace --all-targets --all-features