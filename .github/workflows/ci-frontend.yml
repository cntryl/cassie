name: CI Frontend

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ci-frontend.yml
      - public/openapi.yml
      - ui/**
  pull_request:
    paths:
      - .github/workflows/ci-frontend.yml
      - public/openapi.yml
      - ui/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: self-hosted
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: |
          npm install --global npm@11.16.0
          npm ci --strict-allow-scripts

      - name: Verify current Askr packages
        run: |
          npx --no-install askr upgrade
          git diff --exit-code -- package.json package-lock.json

      - name: Askr analyzer
        run: npx --no-install askr analyze

      - name: Check generated adapters
        run: npm run gen:adapters:check

      - name: UI format check
        run: npm run fmt:check

      - name: UI lint
        run: npm run lint

      - name: Production dependency audit
        run: npm run audit:production

      - name: UI type check
        run: npm run type-check

      - name: UI build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: UI tests
        run: npm run test -- --run

      - name: Mock browser tests
        run: npm run test:e2e:mock
