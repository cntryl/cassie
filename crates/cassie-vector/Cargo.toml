[package]
name = "cassie-vector"
version = "0.2.0"
edition = "2021"
publish = false

[dependencies]
cassie-core = { path = "../cassie-core" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
cassie-bench-support = { path = "../cassie-bench-support" }

[[bench]]
name = "tier1_hotpath_vector_distance"
harness = false
path = "benches/tier1_hotpath_vector_distance.rs"

[[bench]]
name = "tier2_subsystem_vector"
harness = false
path = "benches/tier2_subsystem_vector.rs"

[lints]
workspace = true
