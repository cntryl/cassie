services:
  cassie:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:5432:5432"
    environment:
      CASSIE_REST_LISTEN: 0.0.0.0:8080
      CASSIE_PGWIRE_LISTEN: 0.0.0.0:5432
      CASSIE_ROOT_PASSWORD: ${CASSIE_ROOT_PASSWORD:?set a non-default root secret}
      CASSIE_STORAGE_PATH: /data/cassie
      CASSIE_ALLOW_INSECURE_NON_LOOPBACK_LISTEN: "1"
    volumes:
      - cassie-data:/data

volumes:
  cassie-data:
