[package]
name = "cassie"
version = "0.1.0"
edition = "2021"

[dependencies]
bytes = "1.12"
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1.53", features = ["full"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
thiserror = "2.0"
uuid = { version = "1.24", features = ["v4", "serde"] }
cntryl-midge = { package = "cntryl-midge", git = "https://github.com/cntryl/midge", rev = "87ea77bfc6e295a319952aea8a9a2df25d8cbdec" }
cntryl-lexkey = { package = "cntryl-lexkey", git = "https://github.com/cntryl/lexkey-rs", rev = "40cb5e21cbafba763b7931a04f6c6ae2fc5a67a3" }
hyper = { version = "1.11", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking", "json"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.11"
time = { version = "0.3", features = ["formatting", "parsing"] }

[dev-dependencies]
cntryl-stress = { git = "https://github.com/cntryl/stress", rev = "17b6d6907edd7eddcdb98255bd44dc6aeab5d5f6" }
rcgen = "0.14"
tokio-postgres = "0.7"

