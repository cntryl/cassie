# AI Agents should not touch this file

name: CI Backend

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "ui/**"
  push:
    paths-ignore:
      - "ui/**"
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cntryl-tools
        run: |
          cargo install --git https://github.com/cntryl/tools \
            --rev bc2d07782cf6873e1a4962fe8fe91396daa81a24 \
            --locked cntryl-tools

      - name: Cargo fmt check
        run: cargo fmt --all -- --check

      - name: Validate tests
        run: cntryl-tools validate-tests

      - name: Cargo clippy pedantic
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -D clippy::pedantic

      - name: Cargo check
        run: cargo check --workspace --all-targets --all-features

      - name: Cargo test
        run: cargo test --locked --workspace --all-features
